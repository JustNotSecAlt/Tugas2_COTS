<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Mahasiswa - CRUD</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/"><i class="bi bi-mortarboard-fill"></i> Mahasiswa CRUD</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/">Beranda</a></li>
          <li class="nav-item"><a class="nav-link" href="/data.html">Data Mahasiswa</a></li>
          <li class="nav-item"><a class="nav-link active" href="/form.html">Tambah Data</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-primary text-white">
            <h4 class="mb-0">
              <i class="bi bi-person-plus-fill"></i>
              <span id="formTitle">Tambah Mahasiswa</span>
            </h4>
          </div>
          <div class="card-body p-4">
            <div id="alertContainer"></div>

            <form id="formMahasiswa" novalidate>
              <input type="hidden" id="mahasiswaId" name="id" value="">

              <div class="mb-3">
                <label for="nim" class="form-label">NIM <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="nim" name="nim" placeholder="Contoh: 2210001" required>
                <div class="invalid-feedback">NIM wajib diisi.</div>
              </div>

              <div class="mb-3">
                <label for="nama" class="form-label">Nama Lengkap <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="nama" name="nama" placeholder="Nama lengkap mahasiswa" required>
                <div class="invalid-feedback">Nama wajib diisi.</div>
              </div>

              <div class="mb-3">
                <label for="jurusan" class="form-label">Jurusan <span class="text-danger">*</span></label>
                <select class="form-select" id="jurusan" name="jurusan" required>
                  <option value="">-- Pilih Jurusan --</option>
                  <option value="Teknik Informatika">Teknik Informatika</option>
                  <option value="Sistem Informasi">Sistem Informasi</option>
                  <option value="Teknik Komputer">Teknik Komputer</option>
                  <option value="Manajemen Informatika">Manajemen Informatika</option>
                  <option value="Teknik Elektro">Teknik Elektro</option>
                </select>
                <div class="invalid-feedback">Jurusan wajib dipilih.</div>
              </div>

              <div class="mb-3">
                <label for="angkatan" class="form-label">Angkatan <span class="text-danger">*</span></label>
                <input type="number" class="form-control" id="angkatan" name="angkatan" min="2000" max="2100" placeholder="Contoh: 2024" required>
                <div class="invalid-feedback">Angkatan wajib diisi (tahun valid).</div>
              </div>

              <div class="mb-4">
                <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                <input type="email" class="form-control" id="email" name="email" placeholder="contoh@email.com" required>
                <div class="invalid-feedback">Format email tidak valid.</div>
              </div>

              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary" id="btnSubmit">
                  <i class="bi bi-save"></i> <span id="btnSubmitText">Simpan</span>
                </button>
                <button type="reset" class="btn btn-outline-secondary">
                  <i class="bi bi-arrow-counterclockwise"></i> Reset
                </button>
                <a href="/data.html" class="btn btn-outline-dark ms-auto">
                  <i class="bi bi-list"></i> Lihat Data
                </a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center py-4 text-muted small">
    &copy; 2026 Praktikum ABP - Pertemuan 2
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="/js/form.js"></script>
</body>
</html>
